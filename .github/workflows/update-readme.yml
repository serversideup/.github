name: Update README
on:
  workflow_call:
    inputs:
      commit_mode:
        description: '"push" commits to the branch directly. "pull-request" opens an auto-merging PR, for branches that require PRs and status checks.'
        type: string
        default: push
    secrets:
      pr_token:
        description: 'Personal access token for "pull-request" mode. Pushes and PRs made with GITHUB_TOKEN never trigger the required status checks.'
        required: false
jobs:
  update-readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        # An explicit shell turns on pipefail, so a failed download stops the job instead of emptying the README
        shell: bash
    env:
      COMMIT_MODE: ${{ inputs.commit_mode }}
      PR_BRANCH: readme-sync
    steps:
      - name: Check Settings 🔍
        if: inputs.commit_mode != 'push'
        env:
          HAS_PR_TOKEN: ${{ secrets.pr_token != '' }}
        run: |
          if [ "$COMMIT_MODE" != "pull-request" ]; then
            echo "::error::commit_mode must be \"push\" or \"pull-request\", got \"$COMMIT_MODE\"."
            exit 1
          fi
          if [ "$HAS_PR_TOKEN" != "true" ]; then
            echo "::error::commit_mode \"pull-request\" needs the pr_token secret."
            exit 1
          fi

      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.pr_token || github.token }}

      - name: Update Sponsors and About Us 💖
        run: |
          for section in sponsors about; do
            marker="<!-- serversideup-${section} -->"
            marker_count=$(grep -cxF "$marker" README.md || true)
            if [ "$marker_count" -eq 0 ]; then
              echo "::notice::No $marker markers in README.md, skipping ${section}."
              continue
            fi
            if [ "$marker_count" -ne 2 ]; then
              echo "::error::Expected 2 $marker markers in README.md, found $marker_count."
              exit 1
            fi

            # Drop this repo's own entry so it isn't listed as one of "our other projects".
            curl -fsSL "https://serversideup.net/github/${section}.md" \
              | grep -vF "<!-- repo:${GITHUB_REPOSITORY} -->" > "$RUNNER_TEMP/${section}.md"

            awk -v marker="$marker" -v content="$RUNNER_TEMP/${section}.md" '
              $0 == marker {
                print
                if (!inside) { while ((getline line < content) > 0) print line }
                inside = !inside
                next
              }
              !inside
            ' README.md > "$RUNNER_TEMP/README.md"
            mv "$RUNNER_TEMP/README.md" README.md
          done

      - name: Commit Changes 🚀
        env:
          GH_TOKEN: ${{ secrets.pr_token }}
        run: |
          git add README.md
          if git diff --staged --quiet; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$COMMIT_MODE" = "push" ]; then
            git commit -m "Update README sponsors and About Us"
            git push
            exit 0
          fi

          # Force-pushing one long-lived branch keeps at most one open README PR, which picks up each week's changes.
          git switch -C "$PR_BRANCH"
          git commit -m "Update README sponsors and About Us"
          git push --force origin "$PR_BRANCH"
          if [ -z "$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$GITHUB_REF_NAME" --head "$PR_BRANCH" \
              --title "Update README sponsors and About Us" \
              --body "Automated update from https://serversideup.net/github/sponsors.md and https://serversideup.net/github/about.md. It merges automatically once the required checks pass."
          fi
          gh pr merge "$PR_BRANCH" --auto --squash --delete-branch
